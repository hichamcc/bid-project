; PHP overrides for the app (honored by PHP-FPM / CGI, e.g. GoDaddy shared hosting).
; The Scope Review import posts up to ~500 rows x ~18 fields per batch, which
; exceeds the default max_input_vars (1000) and can exceed the default POST size.

max_input_vars = 15000
post_max_size = 32M
upload_max_filesize = 15M
